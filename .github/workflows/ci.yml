# Every PR and every push to main. Branch protection on main should require
# checks, migrations and "Playwright (live LiteAPI sandbox)" (docs/deploy.md,
# docs/testing.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by e2e-author.yml after it pushes tests: a push made with
  # GITHUB_TOKEN starts no workflow on its own.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and unit + pg tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  migrations:
    # The deploy path on a real Postgres: the base branch's migrations first
    # (production's state before this PR), then this branch's, applied by the
    # same script the production build runs; then the built app's health check
    # against that database. This is the class of failure of 2026-11-13.
    name: Migrations, build and health on Postgres 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: hf }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hf
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply the base branch's migrations (production before this change)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          if [ -f ../base/scripts/migrate.mjs ]; then
            ln -s "$PWD/node_modules" ../base/node_modules
            node ../base/scripts/migrate.mjs
          else
            echo "::notice::base branch has no scripts/migrate.mjs yet; starting from an empty database"
          fi
      - name: Apply this branch's migrations
        run: npm run db:migrate
      - name: Apply them again (must be a no-op)
        run: |
          npm run db:migrate | tee /tmp/second.txt
          grep -q "ok: 0 applied" /tmp/second.txt
      - run: npm run build
      - name: The built app reports a healthy database
        run: |
          npx next start -p 3000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/hotels && break; sleep 1; done
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/hotels/api/health)
          cat /tmp/health.json; echo
          [ "$code" = 200 ] || { cat /tmp/server.log; exit 1; }

  e2e:
    # Sharded across runners; within a shard, E2E_WORKERS parallel workers on one
    # dev server and its embedded database. The shard and worker counts, and the
    # measurements behind them, are in docs/testing.md. Every shard shares the one
    # LiteAPI sandbox key and its rate limit: raise them together, and measure.
    name: Playwright shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: 'true'
      E2E_SHARDED: '1'
      E2E_WORKERS: '2'
      # The SANDBOX key: test bookings only, cancelled by the specs.
      LITE_API_KEY: ${{ secrets.LITE_API_KEY }}
    steps:
      - name: The sandbox key is set
        run: |
          if [ -z "$LITE_API_KEY" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              echo "::warning::A fork's PR gets no secrets: Playwright skipped. A maintainer re-runs it from a branch."; echo "SKIP=1" >> "$GITHUB_ENV"
            else
              echo "::error::Add the LiteAPI sandbox key as the LITE_API_KEY repository secret (Settings → Secrets → Actions)."; exit 1
            fi
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: 22, cache: npm }
      - if: env.SKIP != '1'
        run: npm ci
      - name: Cache the Playwright browser
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: env.SKIP != '1'
        run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shard }}
        if: env.SKIP != '1'
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && env.SKIP != '1'
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  e2e-report:
    # One HTML report for all shards, and the one check branch protection requires
    # (the same name the single e2e job had, so the rule does not change).
    name: Playwright (live LiteAPI sandbox)
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the shards into one HTML report
        id: merge
        run: |
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then echo "::notice::No shard ran (a fork's PR, or no LITE_API_KEY)."; exit 0; fi
          npm ci
          npx playwright merge-reports --reporter html ./all-blob-reports
          echo "merged=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.merged == '1'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || [ "${{ needs.e2e.result }}" = "skipped" ]
